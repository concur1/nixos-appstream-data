# The Python scripts in scripts/ (flathub_merge.py). CI runs them with the
# flake's `python` package; this is for running them, or the tests, with uv:
#
#   uv run python -m unittest discover tests
[project]
name = "nixos-appstream-data-scripts"
version = "0"
requires-python = ">=3.13"
# Tested with 1.36 (the flake's nixpkgs), 1.42 and 2.2.
dependencies = ["polars>=1.36,<3"]

[tool.uv]
package = false
