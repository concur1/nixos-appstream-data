# The Python scripts in scripts/ (flathub_merge.py), run with uv, here and
# in CI; AGENTS.md has the checks.
[project]
name = "nixos-appstream-data-scripts"
version = "0"
requires-python = ">=3.13"
# Tested with 1.36, 1.42 and 2.2; uv.lock has the one used.
dependencies = ["polars>=1.36,<3"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.112",
]

[tool.ruff]
line-length = 120

[tool.ty.environment]
python-version = "3.13"
# The scripts import each other from their own directory, as the tests do.
extra-paths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
