# The check suite of the Python scripts (AGENTS.md).
name: Test scripts

on:
  push:
    paths: ["scripts/**", "tests/**", "pyproject.toml", "uv.lock"]
  pull_request:
    paths: ["scripts/**", "tests/**", "pyproject.toml", "uv.lock"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: false
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest -v
