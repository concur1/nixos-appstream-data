# The tests of the Python scripts, with the flake's Python and Polars.
name: Test scripts

on:
  push:
    paths: ["scripts/**", "tests/**", "flake.*", "pyproject.toml"]
  pull_request:
    paths: ["scripts/**", "tests/**", "flake.*", "pyproject.toml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - run: nix shell .#python --command python3 -m unittest discover -v tests
