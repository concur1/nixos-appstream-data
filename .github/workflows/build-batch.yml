# Runs scripts/build-batch.sh one batch at a time and commits the catalogue
# when a pass over nixpkgs completes. Copy to .github/workflows/ in
# nixos-appstream-data (or a fork), with build-batch.sh in scripts/.
#
# State between runs is workspace/, kept in the Actions cache. Each run saves
# a new entry and restores the newest, so a run that is cut off still keeps
# what it finished.
name: Build AppStream data (batches)

on:
  schedule:
    # About 26,000 apps and tools: a pass is 13 batches of 2,000.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: Attrs per batch
        default: "2000"

# One batch at a time: runs share workspace/.
concurrency:
  group: appstream-batches
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's preinstalled toolchains take about 30 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0

      - name: Restore workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            workspace
            !workspace/narcache
          key: asgen-workspace-${{ github.run_id }}
          restore-keys: asgen-workspace-

      - name: Build one batch
        # Stops early enough for the workspace to be saved.
        timeout-minutes: 330
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '2000' }}
        run: |
          nix shell --inputs-from . .#appstream-generator nixpkgs#jq nixpkgs#expect \
            --command scripts/build-batch.sh

      - name: Save workspace
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Archives of a batch that was cut off aren't worth the space.
          path: |
            workspace
            !workspace/narcache
          key: asgen-workspace-${{ github.run_id }}

      - name: Upload generator log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appstream-generator-log
          path: workspace/appstream-generator.log
          if-no-files-found: ignore

      # Only the run that completes a pass changes appstream/.
      - name: Commit catalogue
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git add appstream
          if git diff --cached --quiet; then
            echo "Pass not complete yet; nothing to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update AppStream data (nixpkgs $(cat workspace/last-pass))"
          git push
