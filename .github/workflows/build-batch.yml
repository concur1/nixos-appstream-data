# Debug branch only: runs scripts/debug-batch.sh on a few packages instead of
# a pass, to see why the generator gives some of them no component. Touches
# neither the workspace cache nor the releases.
name: Build AppStream data (batches)

on:
  workflow_dispatch:
    inputs:
      attrs:
        description: Attrs to process, space-separated
        default: >-
          firefox firefox-esr librewolf ghidra helix kdePackages.konsole
          kdePackages.kcalc audacity abiword

concurrency:
  group: appstream-debug
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: false

      - name: Process the packages
        env:
          ATTRS: ${{ inputs.attrs }}
          DEBUG_WS: ${{ runner.temp }}/asgen-debug
        run: |
          # shellcheck disable=SC2086 # one attr per word
          nix shell --inputs-from . .#appstream-generator nixpkgs#jq nixpkgs#expect \
            --command scripts/debug-batch.sh $ATTRS 2>&1 | tee "$RUNNER_TEMP/debug.txt"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo '### Hints'
              echo '```json'
              sed -n '/^== Hints, by package/,/^== Components/p' "$RUNNER_TEMP/debug.txt" | sed '1d;$d'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the debug workspace
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generator-debug
          path: |
            ${{ runner.temp }}/debug.txt
            ${{ runner.temp }}/asgen-debug/appstream-generator.log
            ${{ runner.temp }}/asgen-debug/export/hints
            ${{ runner.temp }}/asgen-debug/export/data
            ${{ runner.temp }}/asgen-debug/nix-index
            ${{ runner.temp }}/asgen-debug/cache/nixpkgs
          if-no-files-found: warn
